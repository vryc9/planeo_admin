spring.application.name=planeo_admin
server.port=8083
spring.profiles.active=dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Invitation links
planeo.invitation.expiration-hours=48

# Admin API key required (X-Api-Key header) to create/revoke invitations.
# No default here on purpose: startup fails fast if it isn't set via env var.
planeo.security.admin-api-key=${PLANEO_ADMIN_API_KEY}