spring.datasource.url=jdbc:mysql://planeo-admin-db:3306/planeo_admin?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Public front-end used to build registration links - set per environment.
planeo.invitation.base-url=${PLANEO_INVITATION_BASE_URL}

# Required: no default. Startup fails fast if PLANEO_ADMIN_API_KEY is unset.
planeo.security.admin-api-key=${PLANEO_ADMIN_API_KEY}