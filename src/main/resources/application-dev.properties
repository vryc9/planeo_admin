spring.datasource.url=jdbc:mysql://localhost:3308/planeo_admin?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Local front-end used to build registration links
planeo.invitation.base-url=http://localhost:4200

# Dev-only fallback so the app can start without setting the env var locally.
# Never rely on this default outside a local machine.
planeo.security.admin-api-key=${PLANEO_ADMIN_API_KEY:dev-only-change-me}